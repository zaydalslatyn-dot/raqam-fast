name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Download language data
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail -o app/src/main/assets/ara.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata
          curl -L --fail -o app/src/main/assets/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
      - name: Build
        run: gradle assembleDebug -POCR_API_KEY="${{ secrets.OCR_API_KEY }}"
      - uses: actions/upload-artifact@v4
        with:
          name: raqam-apk
          path: app/build/outputs/apk/debug/app-debug.apk
